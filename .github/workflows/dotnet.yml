name: .NET

on:
  push:
    branches: [ master, development ]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs on development are never cancelled: a
# cancelled run saves no NuGet cache, leaves no timings for the next run's test plan, and leaves
# its commit unreleasable. Each push gets a group of its own, since a group holds only one
# pending run and replaces it with the next.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The suite runs in RUNNERS x LANES test processes: LANES processes side by side on each of
  # RUNNERS runners (see .github/scripts/TestShards.cs).
  RUNNERS: 8
  LANES: 2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # A PR that changes only docs skips the build and tests. Anything in doubt (an API error, an
      # empty list, a PR too large to list) runs everything. The skip is done with job conditions,
      # not paths-ignore, so the required "tests complete" check still reports.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] \
            && files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')" \
            && [ -n "$files" ] && [ "$(echo "$files" | wc -l)" -lt 3000 ]; then
            if ! echo "$files" | grep -Ev '\.md$|^docs/|^\.github/agents/|^\.claude/' | grep -q .; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "::notice::Only docs changed; skipping the build and tests."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    # Restored on every run, saved only from development: a PR's cache can only be read by that
    # PR, and the 10 GB per-repository limit evicts the oldest caches first.
    - name: Restore NuGet cache
      id: nuget
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', '.config/dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-
    - name: Restore dependencies
      run: dotnet restore
    - name: Save NuGet cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/development' && steps.nuget.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.nuget/packages
        key: ${{ steps.nuget.outputs.cache-primary-key }}
    - name: Build
      run: dotnet build --no-restore
    # Lanes are balanced on how long each test took in the last 3 green runs on development, or,
    # on a PR with none there, the PR's own last green runs. Without any (a first run, expired
    # artifacts) they're balanced on test case counts instead.
    - name: Fetch earlier test timings
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD: ${{ github.head_ref }}
      run: |
        last_green() {
          gh run list -R "$REPO" --workflow dotnet.yml --status success --limit 3 \
            --json databaseId --jq '.[].databaseId' "$@" 2>/dev/null || true
        }
        runs=$(last_green --branch development --event push)
        if [ -z "$runs" ] && [ -n "$HEAD" ]; then
          runs=$(last_green --branch "$HEAD")
        fi
        for run in $runs; do
          echo "Timings from run $run."
          gh run download "$run" -R "$REPO" --pattern 'test-results-*' --dir "timings/$run" \
            || echo "::notice::No timings from run $run."
        done
    - name: Plan test lanes
      id: plan
      run: |
        dotnet run .github/scripts/TestShards.cs -- \
          src/Rasa.Test/bin/Debug/net10.0/Rasa.Test.dll $((RUNNERS * LANES)) src/Rasa.Test/bin/Debug/net10.0/lanes timings
        echo "runners=$(jq -cn --argjson n "$RUNNERS" '[range($n)]')" >> "$GITHUB_OUTPUT"
    # One archive so file modes survive (upload-artifact doesn't keep them).
    - name: Package test build
      run: tar -czf test-build.tgz src/Rasa.Test/bin/Debug/net10.0
    - uses: actions/upload-artifact@v7
      with:
        name: test-build
        path: test-build.tgz
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.build.outputs.runners) }}
    steps:
    # The tests read the navmeshes, Dockerfile and some sources from the repository root.
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@v8
      with:
        name: test-build
    - run: tar -xzf test-build.tgz
    - name: Test
      # Each lane is its own test host, so lanes share no static state. A test host that outgrows
      # the runner's 16 GB makes the VM stop answering and GitHub reports "lost communication" with
      # no log, so the lanes' GC heaps are capped at 12 GB between them: an overgrown lane fails
      # with an OutOfMemoryException and a stack trace instead.
      env:
        RUNNER: ${{ matrix.runner }}
      run: |
        export DOTNET_GCHeapHardLimit=$(printf '0x%x' $((12 * 1024 * 1024 * 1024 / LANES)))
        bin=src/Rasa.Test/bin/Debug/net10.0
        # The CLI's first run on a fresh machine takes a named mutex; lanes starting at the same
        # moment race for it ("NuGet-Migrations ... EEXIST"). One run up front settles it.
        dotnet test "$bin/Rasa.Test.dll" --list-tests > /dev/null
        pids=()
        for lane in $(seq $((RUNNER * LANES)) $((RUNNER * LANES + LANES - 1))); do
          dotnet test "$bin/Rasa.Test.dll" \
            --filter "$(cat "$bin/lanes/lane-$lane.filter")" \
            --blame-hang-timeout 10m \
            --logger "trx;LogFileName=lane-$lane.trx" \
            --results-directory "TestResults/lane-$lane" > "lane-$lane.log" 2>&1 &
          pids+=("$lane:$!")
        done
        status=0
        for entry in "${pids[@]}"; do
          lane=${entry%%:*}
          if wait "${entry##*:}"; then result=passed; else result=FAILED; status=1; fi
          echo "::group::lane $lane $result"
          cat "lane-$lane.log"
          echo "::endgroup::"
        done
        exit $status
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.runner }}
        path: TestResults/
        retention-days: 14

  # Fails when any of the six EF contexts has model changes no migration covers. The design-time
  # factories use a fixed MySQL server version, so no database server is needed.
  drift:
    name: migration drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore NuGet cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', '.config/dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-
    - run: dotnet tool restore
    - run: dotnet build src/Rasa.Game
    - name: Check every context for pending model changes
      run: |
        status=0
        for context in SqliteAuthContext MySqlAuthContext SqliteCharContext MySqlCharContext SqliteWorldContext MySqlWorldContext; do
          echo "::group::$context"
          if ! dotnet ef migrations has-pending-model-changes --no-build --project src/Rasa.DBL --startup-project src/Rasa.Game --context "$context"; then
            echo "::error::$context has model changes without a migration (or could not be checked)."
            status=1
          fi
          echo "::endgroup::"
        done
        exit $status

  # The MySql test category against a real server, after every MySQL migration is applied to it
  # from empty, the way a MySQL deployment gets its schema. The other lanes leave this category
  # out (TestShards.cs) and only build the MySQL model offline.
  mysql:
    name: mysql (${{ matrix.mysql }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql: [ '8.0', '8.4' ]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: rasa-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prasa-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      RASA_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=rasa-ci
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore NuGet cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json', '.config/dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-
    # The design-time factories read databasesettings.json and then databasesettings.env.json from
    # the build output, the same files the servers read; the override points them at the service.
    # The timeout is also the command timeout, and the seed migrations insert thousands of rows.
    - name: Point the database settings at the service
      run: |
        jq '.Databases |= ((.Auth, .Char, .World) |= (.Host = "127.0.0.1" | .Port = 3306 | .User = "root" | .Password = "rasa-ci"
            | .TimeoutInMilliseconds = 600000))' \
          src/Rasa.DBL/databasesettings.json > src/Rasa.DBL/databasesettings.env.json
    - run: dotnet tool restore
    - name: Build
      run: dotnet build src/Rasa.Test
    - name: Apply the MySQL migrations
      run: |
        for context in MySqlAuthContext MySqlCharContext MySqlWorldContext; do
          dotnet ef database update --no-build --project src/Rasa.DBL --startup-project src/Rasa.Game --context "$context"
        done
    - name: Test
      run: |
        dotnet test src/Rasa.Test --no-build \
          --filter TestCategory=MySql \
          --blame-hang-timeout 10m \
          --logger "trx;LogFileName=mysql.trx" \
          --results-directory TestResults
        ran=$(grep -o '<UnitTestResult ' TestResults/mysql.trx | wc -l)
        passed=$(grep -o '<UnitTestResult [^>]*outcome="Passed"' TestResults/mysql.trx | wc -l)
        echo "MySQL ${{ matrix.mysql }}: $ran results, $passed passed." | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$passed" -eq 0 ] || [ "$passed" -ne "$ran" ]; then
          echo "::error::Every MySql test must run and pass against the server ($passed of $ran passed)."
          exit 1
        fi
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mysql-results-${{ matrix.mysql }}
        path: TestResults/
        retention-days: 14

  # The one check to require: it passes when every lane passed, or when the PR changed only docs.
  tests-complete:
    name: tests complete
    needs: [ changes, build, test, drift, mysql ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - if: needs.changes.outputs.code == 'true'
      uses: actions/download-artifact@v8
      with:
        pattern: test-results-*
        path: results
    - env:
        CODE: ${{ needs.changes.outputs.code }}
        CHANGES: ${{ needs.changes.result }}
        BUILD: ${{ needs.build.result }}
        TEST: ${{ needs.test.result }}
        DRIFT: ${{ needs.drift.result }}
        MYSQL: ${{ needs.mysql.result }}
      run: |
        if [ "$CHANGES" = success ] && [ "$CODE" = false ]; then
          echo "Docs-only change; tests skipped."
          exit 0
        fi
        total=0; passed=0; failed=0
        for trx in $(find results -name '*.trx' 2>/dev/null); do
          total=$((total + $(grep -o '<UnitTestResult ' "$trx" | wc -l)))
          passed=$((passed + $(grep -o '<UnitTestResult [^>]*outcome="Passed"' "$trx" | wc -l)))
          failed=$((failed + $(grep -o '<UnitTestResult [^>]*outcome="Failed"' "$trx" | wc -l)))
        done
        echo "Across all lanes: $total results, $passed passed, $failed failed." | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$BUILD" != success ] || [ "$TEST" != success ] || [ "$DRIFT" != success ] || [ "$MYSQL" != success ]; then
          echo "::error::build: $BUILD, test runners: $TEST, migration drift: $DRIFT, mysql: $MYSQL"
          exit 1
        fi
