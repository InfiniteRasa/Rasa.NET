name: Container

# Builds the image and starts it with docker-compose.yml, then checks each service listens on
# every port compose maps for it. Not a required check, so a paths filter is safe here.
on:
  push:
    branches: [ development ]
    paths: [ Dockerfile, .dockerignore, docker-compose.yml, global.json, Directory.Packages.props, Rasa.NET.sln, '.config/**', 'navmesh/**', 'src/**', .github/workflows/container.yml ]
  pull_request:
    paths: [ Dockerfile, .dockerignore, docker-compose.yml, global.json, Directory.Packages.props, Rasa.NET.sln, '.config/**', 'navmesh/**', 'src/**', .github/workflows/container.yml ]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    # The layer cache is read on every run and written only from development, for the same
    # reason as the NuGet cache in dotnet.yml: a PR's cache can only be read by that PR.
    - name: Build the image
      id: image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        push: false
        tags: rasa_net
        cache-from: type=gha
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
    # Compose mounts these from the repository root. The image runs as UID 1654, so they must be
    # writable by it.
    - name: Create the mounted files
      run: |
        touch rasaauth.db rasachar.db rasaworld.db
        echo '{}' > appsettings.env.json
        chmod 666 rasaauth.db rasachar.db rasaworld.db appsettings.env.json
    - run: docker compose up --detach --no-build
    - name: Wait for both servers
      run: |
        ready() { docker compose logs --no-color "$1" 2>&1 | grep -q "$2"; }
        for _ in $(seq 120); do
          if ready auth 'Listening for clients on port' && ready game 'Server ready!'; then
            exit 0
          fi
          # Both services have restart: always, so a crash shows as a restart, not an exit.
          for id in $(docker compose ps --all --quiet); do
            if [ "$(docker inspect -f '{{.RestartCount}} {{.State.Status}}' "$id")" != "0 running" ]; then
              echo "::error::A service crashed or stopped during startup."
              exit 1
            fi
          done
          sleep 2
        done
        echo "::error::The servers weren't ready within 4 minutes."
        exit 1
    # Probed from inside each container: a probe of the published port on the host always
    # connects, because Docker's proxy accepts the connection itself whether or not anything
    # listens behind it. UDP can't be probed this way, so its startup log line is checked.
    - name: Check every mapped port
      run: |
        status=0
        config=$(docker compose config --format json)
        for service in auth game; do
          for port in $(jq -r --arg s "$service" '.services[$s].ports[]? | select((.protocol // "tcp") == "tcp") | .target' <<< "$config"); do
            if docker compose exec -T "$service" bash -c "exec 3<>/dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "$service listens on tcp/$port"
            else
              echo "::error::$service doesn't listen on tcp/$port, which docker-compose.yml maps."
              status=1
            fi
          done
          for port in $(jq -r --arg s "$service" '.services[$s].ports[]? | select(.protocol == "udp") | .target' <<< "$config"); do
            if docker compose logs --no-color "$service" | grep -qE "UDP port ${port}([^0-9]|$)"; then
              echo "$service listens on udp/$port"
            else
              echo "::error::$service never logged listening on udp/$port, which docker-compose.yml maps."
              status=1
            fi
          done
        done
        exit $status
    - name: Check the image runs as a non-root user
      run: test "$(docker run --rm rasa_net id -u)" = 1654
    # The containers are left running so their logs can be read here.
    - name: Service logs
      if: always()
      run: docker compose logs --no-color
    # Advisory: reports known HIGH and CRITICAL vulnerabilities and never fails the job, not even
    # when the vulnerability database can't be downloaded. Its cache is off so PR runs save none.
    # Pinned by commit: the trivy-action tags were overwritten with a credential stealer in March
    # 2026 (CVE-2026-33634).
    - name: Scan the image
      if: always() && steps.image.outcome == 'success'
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: rasa_net
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '0'
        cache: 'false'
